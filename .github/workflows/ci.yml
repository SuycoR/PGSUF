name: CI/CD Pipeline

on:
  push:
    branches: [ develop, main, "feature/**" ]
  pull_request:
    branches: [ develop, main ]

jobs:
  backend:
    name: Backend Test & Build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: servicios_universitarios_test
          MYSQL_USER: app_servicios
          MYSQL_PASSWORD: app_servicios_pass
          MYSQL_ROOT_PASSWORD: root_pass
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Configure MySQL Databases
        run: |
          docker exec ${{ job.services.mysql.id }} mysql -u root -proot_pass -e "
            CREATE DATABASE IF NOT EXISTS servicios_universitarios CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
            CREATE DATABASE IF NOT EXISTS servicios_universitarios_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
            GRANT ALL PRIVILEGES ON *.* TO 'app_servicios'@'%';
            FLUSH PRIVILEGES;
          "

      - name: Run Maven Tests
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/servicios_universitarios_test?serverTimezone=America/Lima
          DB_USER: app_servicios
          DB_PASSWORD: app_servicios_pass
          JWT_SECRET: dGhpcy1pcy1hLXZlcnktc2VjdXJlLWFuZC1sb25nLWp3dC1zZWNyZXQta2V5LTMyYnl0ZXM=
          CORS_ALLOWED_ORIGINS: http://localhost:5173
        run: |
          sed -i 's/\r$//' ./mvnw
          chmod +x ./mvnw
          ./mvnw clean test

      - name: Print Test Results on Failure
        if: failure()
        working-directory: backend
        run: |
          echo "==== SUREFIRE TEST FAILURES ===="
          for f in target/surefire-reports/*.txt; do
            if grep -Eq "FAILURE!|ERROR!" "$f" 2>/dev/null; then
              echo ">>> FILE: $f <<<"
              cat "$f"
              echo ""
            fi
          done

  frontend:
    name: Frontend Lint & Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/app/package-lock.json

      - name: Install dependencies
        working-directory: frontend/app
        run: npm ci

      - name: Lint check
        working-directory: frontend/app
        run: npm run lint

      - name: Run Vitest
        working-directory: frontend/app
        run: npm test

      - name: Build production bundle
        working-directory: frontend/app
        run: npm run build

  docker:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker Compose Build
        run: docker compose build
