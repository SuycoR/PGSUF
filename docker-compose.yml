services:
  db:
    image: mysql:8.4
    container_name: pgsuf-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: servicios_universitarios
      MYSQL_USER: app_servicios
      MYSQL_PASSWORD: ${DB_PASSWORD:-app_servicios_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pgsuf-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pgsuf-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:mysql://db:3306/servicios_universitarios?serverTimezone=America/Lima
      DB_USER: app_servicios
      DB_PASSWORD: ${DB_PASSWORD:-app_servicios_pass}
      JWT_SECRET: ${JWT_SECRET:-dGhpcy1pcy1hLXZlcnktc2VjdXJlLWFuZC1sb25nLWp3dC1zZWNyZXQta2V5LTMyYnl0ZXM=}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80,http://localhost,https://pgsuf.vercel.app}
      CORS_ALLOW_CREDENTIALS: "false"
      LOGIN_MAX_ATTEMPTS: 5
      LOGIN_WINDOW_MINUTES: 15
      UPLOAD_DIR: /app/uploads
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@unmsm.edu.pe}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
    volumes:
      - upload_data:/app/uploads
    ports:
      - "8080:8080"
    networks:
      - pgsuf-net

  frontend:
    build:
      context: ./frontend/app
      dockerfile: Dockerfile
    container_name: pgsuf-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"
    networks:
      - pgsuf-net

volumes:
  db_data:
  upload_data:

networks:
  pgsuf-net:
    driver: bridge
